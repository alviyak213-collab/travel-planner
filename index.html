<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel App | Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand-wrap">
          <span class="brand-badge">T</span>
          <h1>TravelMate</h1>
        </div>

        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to continue to your dashboard.</p>

        <form id="loginForm" class="auth-form" method="post" action="http://127.0.0.1:8000/">
          <label>
            Email
            <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required />
          </label>

          <label>
            Password
            <input type="password" id="loginPassword" name="password" placeholder="••••••••" required />
          </label>

          <button type="submit" class="primary-btn">Login</button>
        </form>

        <div id="authMessage" class="message" aria-live="polite"></div>

        <p class="switch-link">
          Don’t have an account?
          <a href="http://127.0.0.1:8000/register">Register</a>
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
